services:
  postgres:
    image: postgres:17
    container_name: ticketflow-postgres
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - ticketflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  ticket-service:
    build:
      context: ./services/ticket-service
    container_name: ticketflow-ticket-service-compose
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketflow
      SPRING_DATASOURCE_USERNAME: ticketflow
      SPRING_DATASOURCE_PASSWORD: ticketflow
    ports:
      - "8082:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ticketflow-postgres-data:
